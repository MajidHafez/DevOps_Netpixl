# HorizontalPodAutoscaler: changes .spec.replicas of a Deployment/StatefulSet based on metrics.
# Needs Metrics Server. Missing: it does not create pods itself, it only scales another workload.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
