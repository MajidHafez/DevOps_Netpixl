# StatefulSet: for stateful apps (databases, Kafka, etc.).
# Has: stable names (web-0, web-1...), ordered start/stop, one PVC per pod (volumeClaimTemplates), stable DNS via headless Service.
# Missing: easy rollback history like Deployment; pods are not interchangeable.
apiVersion: v1
kind: Service
metadata:
  name: web-headless
spec:
  clusterIP: None                # headless: gives each pod its own DNS record
  selector:
    app: web-sts
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-sts
spec:
  serviceName: web-headless      # required, must match the headless Service
  replicas: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: web-sts
  template:
    metadata:
      labels:
        app: web-sts
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:          # a separate PVC is created for each replica
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
