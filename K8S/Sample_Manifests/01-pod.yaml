# Pod: smallest deployable unit. No self-healing: if it dies (or the node dies) it is gone.
# Has: containers, probes, resources. Missing: replicas, rolling update, rollback.
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: 500m, memory: 256Mi }
      readinessProbe:
        httpGet: { path: /, port: 80 }
      livenessProbe:
        httpGet: { path: /, port: 80 }
  restartPolicy: Always
