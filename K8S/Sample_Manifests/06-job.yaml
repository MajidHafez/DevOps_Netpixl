# Job: run-to-completion task. Pods are expected to finish, not stay up.
# Has: completions, parallelism, backoffLimit, TTL cleanup. Missing: replicas, long-running behaviour, schedule (use CronJob).
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure   # must be OnFailure or Never (never Always)
      containers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c", "echo running migration && sleep 5"]
