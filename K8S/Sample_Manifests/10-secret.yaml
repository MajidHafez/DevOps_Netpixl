# Secret: like ConfigMap but for sensitive data. Only base64-encoded by default (NOT encrypted unless
# encryption-at-rest is enabled on the API server). Restrict access with RBAC.
# stringData lets you write plain text; Kubernetes converts it to base64.
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
type: Opaque
stringData:
  DB_USER: app
  DB_PASSWORD: change-me
